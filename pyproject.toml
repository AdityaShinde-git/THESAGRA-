[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesagra"
version = "0.1.0"
description = "THESAGRA unified database system prototype"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.2",
    "pypdfium2>=4.30,<5",
]

[tool.setuptools]
include-package-data = true
